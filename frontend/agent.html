<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claims Agent Portal | SecureLife</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="agent-body"><header class="agent-header"><div class="container"><a class="brand" href="/"><span class="brand-mark">◆</span><span>SecureLife Claims Desk</span></a><button id="agent-logout" class="btn btn-secondary hidden">Log out</button></div></header><main class="agent-main container"><section id="agent-login-panel" class="form-card agent-login"><h1>Agent sign in</h1><p>Access vehicle accident notifications and update claim progress.</p><div id="agent-alert" class="alert hidden"></div><form id="agent-login-form"><div class="field"><label for="agentUsername">Username</label><input id="agentUsername" name="username" required autocomplete="username"></div><div class="field"><label for="agentPassword">Password</label><input id="agentPassword" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-block" type="submit">Sign in</button></form><p class="small-note">Development account details are configured in the project’s environment file.</p></section><section id="agent-dashboard" class="hidden"><div class="agent-toolbar"><div><span class="eyebrow eyebrow-blue">Claims operations</span><h1>Vehicle accident notifications</h1><p id="agent-welcome"></p></div><button id="refresh-agent" class="btn btn-outline">Refresh</button></div><div id="agent-notifications" class="agent-grid"><div class="empty">Loading notifications…</div></div></section></main><div id="toast-zone" class="toast-zone"></div><script src="js/agent.js"></script></body></html>
